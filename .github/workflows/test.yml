name: Price Scraper

on:
  push:
    branches: [ main, master ]
    paths:
      - "scripts/**"
      - "config.json"
      - "requirements.txt"
  workflow_dispatch:

jobs:
  scrape:
    # GitHub 클라우드 서버에서 실행 (내 컴퓨터가 꺼져 있어도 동작)
    # 브라우저는 Cloudflare Browser Rendering(클라우드 브라우저)을 사용하므로 크롬 설치가 필요 없음
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 패키지 설치
        run: |
          pip install -r requirements.txt
          pip install pandas beautifulsoup4

      - name: 가격 스크래퍼 실행
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          python scripts/scraper.py

      - name: 디버그 파일 보관 (가격을 못 읽었을 때 화면 캡처/HTML 확인용)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-files
          path: outputs/debug_*
          if-no-files-found: ignore

      - name: 결과 CSV 깃허브로 자동 Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add outputs/results.csv
          git diff --staged --quiet || (git commit -m "배민상회 최저가 업데이트 [skip ci]" && git pull --rebase origin main && git push origin main)
