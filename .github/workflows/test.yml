name: Price Scraper

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # 깃허브 Actions 탭에서 버튼 클릭으로 수동 실행 허용

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 생성된 결과 파일을 깃허브 저장소에 push하기 위한 필수 권한

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 필수 라이브러리 및 브라우저 설치
        run: |
          pip install -r requirements.txt
          pip install playwright pandas
          playwright install --with-deps chromium

      - name: 가격 수집 스크립트 실행
        run: |
          python scripts/scraper.py

      - name: 결과 파일(CSV) 깃허브 저장소로 자동 커밋 및 푸시
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add outputs/
          git commit -m "자동 수집 결과 업데이트 [skip ci]" || echo "변경 사항 없음"
          git push
