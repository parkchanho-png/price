name: Price Scraper

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  scrape:
    # 깃허브 클라우드가 아닌 내 컴퓨터(Self-hosted runner)로 실행을 넘김
    runs-on: self-hosted
    permissions:
      contents: write

    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # (중요) Self-hosted runner는 컴퓨터에 이미 설치된 파이썬을 사용하므로 
      # setup-python 액션이 불필요하여 제거했습니다.

      - name: 패키지 설치
        run: |
          pip install -r requirements.txt
          playwright install chromium

      - name: 가격 스크래퍼 실행
        run: |
          python scripts/scraper.py

      - name: 결과 CSV 깃허브로 자동 Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add outputs/results.csv
          git diff --staged --quiet || (git commit -m "쿠팡 최저가 업데이트 [skip ci]" && git pull --rebase origin main && git push origin main)
