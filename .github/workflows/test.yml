name: Price Scraper

on:
  push:
    branches: [ main, master ]
    paths:
      - "scripts/**"
      - "config.json"
      - "requirements.txt"
  workflow_dispatch:

jobs:
  scrape:
    # GitHub 클라우드 서버에서 실행 (내 컴퓨터가 꺼져 있어도 동작)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 패키지 설치
        run: |
          pip install -r requirements.txt
          pip install playwright pandas beautifulsoup4
          playwright install --with-deps chromium

      - name: 가격 스크래퍼 실행
        run: |
          python scripts/scraper.py

      - name: 디버그 파일 보관 (매물을 못 찾았을 때 원인 확인용)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-html
          path: outputs/debug_*.html
          if-no-files-found: ignore

      - name: 결과 CSV 깃허브로 자동 Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add outputs/results.csv
          git diff --staged --quiet || (git commit -m "쿠팡 최저가 업데이트 [skip ci]" && git pull --rebase origin main && git push origin main)
